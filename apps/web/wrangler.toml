name = "kilok"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = ".svelte-kit/cloudflare"

# Environment variables (non-sensitive)
# Secrets like TURSO_AUTH_TOKEN should be set via:
#   wrangler pages secret put TURSO_AUTH_TOKEN
# Or in Cloudflare Dashboard > Pages > Settings > Environment variables

[vars]
# TURSO_DATABASE_URL = "libsql://your-db.turso.io"  # Can be set here if not sensitive
